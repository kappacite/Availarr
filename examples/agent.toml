server_url = "https://availarr.example.com"   # server at the sender
token = "change-me"                            # shared with the server
api_key = "change-me-too"                      # the receiver's Radarr/Sonarr use this as indexer/SAB api key
public_url = "http://availarr-agent:8789"      # how the receiver's Radarr/Sonarr reach this agent
complete_dir = "/downloads/complete"
# port = 8789
# db_path = "/data/agent.db"
# categories = ["radarr", "sonarr", "tv", "movies"]
# poll_seconds = 30
agent_name = "my-agent"                        # name shown in the server panel (default: hostname)
admin_password = "change-me-admin"             # password of the agent UI on :8789 (default: api_key)
# agent_id is generated automatically at setup or first start; do not copy it between agents

[radarr]   # the receiver's instances
url = "http://radarr:7878"
key = "radarr-api-key"

[sonarr]
url = "http://sonarr:8989"
key = "sonarr-api-key"
