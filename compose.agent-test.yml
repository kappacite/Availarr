# Banc d'essai côté B : Tailscale + agent + un Radarr « de B » vierge, sur une seule machine.
# Marche sous Linux et sous Windows (Docker Desktop) : les bases SQLite et l'état Tailscale sont dans des volumes
# Docker, seuls la config de l'agent et les films sont dans des dossiers du projet.
#
#   docker compose -f compose.agent-test.yml up -d --build
#   Avant : créer les dossiers des films
#     Windows : mkdir test-b\media\movies, test-b\media\downloads\complete
#     Linux   : mkdir -p test-b/config test-b/media/movies test-b/media/downloads/complete && sudo chown -R 1000:1000 test-b
#
# Puis :
#   - page de configuration de l'agent : http://localhost:8789
#     code : docker compose -f compose.agent-test.yml logs availarr-agent
#       Tailscale                 = ouvrir le lien affiché et accepter avec le compte Tailscale de A
#       Adresse du server         = celle affichée par le server de A (http://100.x.y.z:8787)
#       Adresse de l'agent        = http://availarr-agent:8789
#       Dossier de téléchargement = /b/downloads/complete
#       Radarr de B               = http://radarr-b:7878  (clé : Radarr B > Settings > General)
#       Sonarr de B               = laisser l'exemple (pas de Sonarr dans ce banc)
#   - Radarr B : http://localhost:7979, root folder /b/movies, indexeur et client SABnzbd comme dans le README.
#
# Options dans un fichier .env : B_MEDIA=<dossier des films>, PGID=1001 (partage SMB), TS_AUTHKEY=<clé>.
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: availarr-agent
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: availarr-agent
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_SOCKET: /var/run/tailscale/tailscaled.sock   # partagé : la page de configuration y lit l'état
      TS_EXTRA_ARGS: --advertise-tags=tag:availarr-agent
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-run:/var/run/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    ports:
      - "8789:8789"   # agent : page de configuration, puis Newznab/SABnzbd
    networks:
      default:
        aliases: [availarr-agent]   # radarr-b joint l'agent par http://availarr-agent:8789

  availarr-agent:
    build: .
    restart: unless-stopped
    command: python -m availarr.agent
    user: "${PUID:-1000}:${PGID:-1000}"
    network_mode: service:tailscale
    depends_on: [tailscale]
    volumes:
      - tailscale-run:/var/run/tailscale
      - ./test-b/config:/config            # agent.toml, écrit par la page de configuration
      - agent-data:/data                   # base SQLite de l'agent
      - ${B_MEDIA:-./test-b/media}:/b      # même montage que radarr-b

  radarr-b:
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - radarr-b-config:/config            # base SQLite de Radarr
      - ${B_MEDIA:-./test-b/media}:/b
    ports:
      - "7979:7878"

volumes:
  tailscale-run:
  tailscale-state:
  agent-data:
  radarr-b-config:
