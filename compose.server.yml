# Côté envoyeur : API (8787, joignable seulement par Tailscale) + panel (8788, tout le réseau local).
# Le panel ne doit PAS être exposé au receveur (ne pas rediriger 8788 sur la box).
#
# Tailscale par défaut : le conteneur "tailscale" porte le réseau, le server tourne dans le même espace réseau.
# Premier démarrage : la page de configuration (http://<hôte>:8788) affiche « Connecter à Tailscale ».
# Optionnel : TS_AUTHKEY=... dans un fichier .env à côté de ce compose, pour se connecter sans clic.
# L'identité Tailscale est ensuite gardée dans ./tailscale.
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: availarr-server
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: availarr-server
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_SOCKET: /var/run/tailscale/tailscaled.sock   # partagé : la page de configuration y lit l'état
      TS_EXTRA_ARGS: --advertise-tags=tag:availarr-server
      TS_TAILSCALED_EXTRA_ARGS: --port=21641   # port UDP fixe, à rediriger sur la box : liaison directe au lieu du relais
    volumes:
      - ./tailscale:/var/lib/tailscale
      - tailscale-run:/var/run/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    ports:
      # Panel : joignable depuis tout le réseau local (protégé par admin_password). Ne jamais l'exposer au receveur.
      # Pour le limiter à cette machine : "127.0.0.1:8788:8788".
      # L'API 8787 n'est volontairement pas publiée : l'agent la joint par Tailscale.
      - "8788:8788"
      # Tailscale (WireGuard) : rediriger UDP 21641 de la box vers cette machine. Sans ça, le trafic passe par
      # les relais DERP de Tailscale, limités à quelques Mbit/s. Ne répond qu'aux machines du tailnet.
      - "21641:21641/udp"

  availarr-server:
    image: kappacitee/availarr-server:latest
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on: [tailscale]
    volumes:
      - tailscale-run:/var/run/tailscale
      - ./config:/config   # modifiable : la page de première configuration y écrit server.toml
      - ./data:/data   # préparer : mkdir -p config data && sudo chown 1000:1000 config data
      # Médias de l'envoyeur, au MÊME chemin que dans son Radarr/Sonarr
      - /media:/media:ro

volumes:
  tailscale-run:
