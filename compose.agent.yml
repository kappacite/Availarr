# Côté B : indexeur Newznab + client SABnzbd factices pour Radarr/Sonarr de B.
services:
  availarr-agent:
    build: .
    restart: unless-stopped
    command: python -m availarr.agent
    ports:
      - "8789:8789"
    volumes:
      - ./config:/config:ro
      - ./data:/data
      # Dossier de téléchargements de B (complete_dir de agent.toml)
      - /downloads:/downloads
